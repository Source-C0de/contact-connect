global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: contacthub

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The ContactHub API exposes Prometheus metrics at /api/v1/metrics.
  - job_name: contacthub-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['app:8090']
        labels:
          service: contacthub-api

  # Alertmanager's own metrics, useful for debugging the alert pipeline.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
