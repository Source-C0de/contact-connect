# Promtail ships the app's structured JSON logs into Loki.
#
# The app writes one JSON object per line to stdout. Promtail's `json`
# pipeline parses each line into structured fields so Loki can index
# `level`, `event` and — crucially — `traceId`, which lets us pivot from
# a metric straight to the exact log lines for a request.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contacthub-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.service=app"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_compose_project']
        target_label: project

    pipeline_stages:
      # Docker wraps container stdout in a JSON envelope.
      - docker: {}

      # Our app emits one JSON object per line.
      - json:
          expressions:
            level: level
            event: event
            traceId: traceId
            status: status
            method: method
            route: route
            durationMs: durationMs
            userId: userId
            role: role

      # Promote the extracted fields to indexed labels.
      - labels:
          level:
          event:
          traceId:
          status:
          method:
          route:

      # Keep the full line as the log body for the UI.
      - output:
          source: output
